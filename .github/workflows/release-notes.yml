name: 同步 Release 标题与说明

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/*.md'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 同步已发布版本的标题与正文
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            notes="docs/releases/$tag.md"
            [[ -f "$notes" ]] || continue
            gh release view "$tag" --json tagName,assets > "$RUNNER_TEMP/before.json"
            gh release edit "$tag" --title "$tag" --notes-file "$notes"
            gh release view "$tag" --json name,tagName,body,assets > "$RUNNER_TEMP/after.json"
            jq -e --arg tag "$tag" --rawfile notes "$notes" \
              '.name == $tag and .tagName == $tag and .body == $notes' "$RUNNER_TEMP/after.json"
            diff <(jq -S '{tagName, assets}' "$RUNNER_TEMP/before.json") \
              <(jq -S '{tagName, assets}' "$RUNNER_TEMP/after.json")
            printf '已同步：%s（附件保持原样）\n' "$tag"
          done < "$RUNNER_TEMP/published-tags"
